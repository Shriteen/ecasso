<div class="viewer">
  <div class="preview-area" (wheel)="onWheel($event)">
    <canvas #canvas
            class="canvas"
            [width]="this.width()"
            [height]="this.height()"
            [style.zoom]="this.zoom"></canvas>
  </div>
  <div class="button-bar">
    @if(this.playState=="running"){
      <button class="pause-btn" (click)="this.pause()">Pause</button>
    }@else{    
      <button class="play-btn" (click)="this.play()">Play</button>
    }
    <button class="step-btn" (click)="this.step()">Step</button>
    <button class="reset-btn" (click)="this.reset()">Reset</button>
    <button class="zoom-in-btn" (click)="this.zoomIn(1.25)">Zoom +</button>
    <button class="zoom-reset-btn" (click)="this.zoomReset()">{{(this.zoom*100).toFixed(2)}}%</button>
    <button class="zoom-out-btn" (click)="this.zoomOut(0.8)">Zoom -</button>
  </div>
</div>
