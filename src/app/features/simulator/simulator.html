<div class="simulator">
  <div class="top-bar">
    <button routerLink="/" class="back-btn">Back</button>
    <span class="title">{{this.name}}</span>
    <div class="view-selector">
      <label><input type="radio" [(ngModel)]="this.viewType" value="EDITOR">Edit</label>
      @if(!isMobile()){      
        <label><input type="radio" [(ngModel)]="this.viewType" value="SPLIT">Combined</label>
      }
      <label><input type="radio" [(ngModel)]="this.viewType" value="VIEWER">View</label>
    </div>
  </div>

  @if(this.simulation){
    <div class="main-view"
       [class]="viewType.toLowerCase()"
       >
      <editor [simulationState]="this.simulation"
            (compiled)="handleCompile()"
            (saved)="handleSave()"
            (reverted)="handleRevert()"
            [persistedSimulation]="this.persistedSimulation" />
      <viewer [simulationState]="this.simulation"
            [width]="this.simulation.cellSize*this.simulation.matrixWidth"
            [height]="this.simulation.cellSize*this.simulation.matrixHeight"
            />
    </div>
  }
</div>
