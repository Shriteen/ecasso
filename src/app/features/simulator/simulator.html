<div class="simulator">
  <div class="top-bar">
    <div><button routerLink="/" class="back-btn">
      <svg lucideMoveLeft></svg>
    </button></div>
    <div class="title">{{this.name}}</div>
    <div>
      <div class="view-selector">
        <label>
          <svg lucidePencil></svg>
          {{!isMobile()?"Edit":""}}
          <input type="radio" [(ngModel)]="this.viewType" value="EDITOR">
        </label>
        @if(!isMobile()){      
        <label>
          <svg lucideSquareSplitHorizontal></svg> Split
          <input type="radio" [(ngModel)]="this.viewType" value="SPLIT">
        </label>
        }
        <label>
          <svg lucideEye></svg>
          {{!isMobile()?"Preview":""}}          
          <input type="radio" [(ngModel)]="this.viewType" value="VIEWER">
        </label>
      </div>
    </div>
  </div>

  @if(this.simulation){
    <div class="main-view"
       [class]="viewType.toLowerCase()"
       >
      <editor [simulationState]="this.simulation"
            (compiled)="handleCompile()"
            (saved)="handleSave()"
            (reverted)="handleRevert()"
            [persistedSimulation]="this.persistedSimulation" />
      <viewer [simulationState]="this.simulation"
            [width]="this.simulation.cellSize*this.simulation.matrixWidth"
            [height]="this.simulation.cellSize*this.simulation.matrixHeight"
            />
    </div>
  }
</div>
