<div class="to-state-container">
  <div class="to-state-details">
    <button class="fold-button" (click)="this.toggleFold()">
      @if(this.folded){
        <svg lucideChevronsUpDown></svg>
      }@else{
        <svg lucideChevronsDownUp></svg>      
      }
    </button>
    <select required class="to-state-options" [(ngModel)]="this.toState().to">
      <option [value]="this.toState().to">{{this.toState().to}}</option>
      @for(state of this.availableStates(); track state._id){
      <option [value]="state.name">{{state.name}}</option>
      }
    </select>
    <button class="to-state-delete-button" (click)="this.delete()">
      <svg lucideTrash2 color="#f67373"></svg>
    </button>
  </div>
  @if(!this.folded){
    @if(this.toState().rule){
      <condition-editor [rule]="this.toState().rule" />
    }
  <!-- <pre>{{toState()|json}}</pre> -->
  }
</div>
