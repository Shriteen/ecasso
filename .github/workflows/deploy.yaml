name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main # Runs whenever you push code to your main branch

# Grants the automatic GITHUB_TOKEN write access to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npx ng build --configuration=production --base-href=/ecasso/

      - name: Create 404.html Fallback
        run: cp dist/ecasso/browser/index.html dist/ecasso/browser/404.html

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/ecasso/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
